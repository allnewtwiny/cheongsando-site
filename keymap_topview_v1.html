<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>취향섬 키맵 탑뷰 v1</title>
<style>
  :root{--ink:#2b2b2b;--sub:#6b6b6b;--bg:#eef0e6}
  html,body{margin:0;height:100%;background:var(--bg);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
  .wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;display:block}
  .head{position:absolute;left:24px;top:20px;pointer-events:none}
  .head h1{margin:0;font-size:20px;letter-spacing:-.02em}
  .head p{margin:4px 0 0;font-size:12px;color:var(--sub)}
  .filters{position:absolute;right:24px;top:20px;display:flex;gap:6px}
  .filters button{border:1px solid #bfc4b2;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .filters button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
  .legend{position:absolute;right:24px;bottom:20px;background:rgba(255,255,255,.88);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.9}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .tip{position:absolute;pointer-events:none;background:#2b2b2b;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
  .plot{cursor:pointer}
  .plot .lawn{transition:filter .2s,opacity .2s}
  .plot:hover .lawn,.plot.sel .lawn{filter:brightness(1.08) saturate(1.25)}
  .plot.sel .ring{opacity:1}
  .plot .ring{opacity:0;transition:opacity .2s}
  .plot.dim{opacity:.35}
  .tag{font-size:11px;font-weight:700;fill:#2b2b2b}
  @media (max-width:640px){.legend{display:none}.filters{top:auto;bottom:16px;right:16px}}
</style>
</head>
<body>
<div class="wrap">
  <svg id="map" viewBox="200 60 1320 1110" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9ec3cf"/><stop offset=".7" stop-color="#bcd8de"/><stop offset="1" stop-color="#d4e6e3"/>
      </linearGradient>
      <pattern id="pave" width="7" height="7" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" fill="#cfcbc3"/><rect x=".6" y=".6" width="5.8" height="5.8" fill="#d9d5ce"/>
      </pattern>
      <pattern id="pebble" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#bdb9b0"/><circle cx="3" cy="3" r="2" fill="#d1cdc5"/><circle cx="8" cy="7" r="1.6" fill="#a9a59c"/>
      </pattern>
      <pattern id="gravel" width="6" height="6" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="#d8ccb8"/><circle cx="1.5" cy="1.5" r=".9" fill="#c4b79f"/><circle cx="4.5" cy="4" r=".8" fill="#e6dccb"/>
      </pattern>
      <radialGradient id="tree" cx=".35" cy=".35" r=".75">
        <stop offset="0" stop-color="#a9c48c"/><stop offset=".6" stop-color="#7d9c62"/><stop offset="1" stop-color="#5f7d49"/>
      </radialGradient>
      <radialGradient id="tree2" cx=".35" cy=".35" r=".75">
        <stop offset="0" stop-color="#8fb07a"/><stop offset=".6" stop-color="#638652"/><stop offset="1" stop-color="#47653a"/>
      </radialGradient>
      <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5e9aa8"/><stop offset="1" stop-color="#8fc0c6"/>
      </linearGradient>
      <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>
        <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .3  0 0 0 0 .1  0 0 0 .09 0"/>
        <feComposite in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
    <g id="g-base"></g>
    <g id="g-trees"></g>
    <g id="g-plots"></g>
    <g id="g-top"></g>
  </svg>
  <div class="head"><h1>청산도 취향섬 키맵</h1><p>탑뷰 도면 v1 · 필지 번호와 유형은 임시(가정)</p></div>
  <div class="filters">
    <button class="on" data-f="all">전체</button>
    <button data-f="P">프리미엄</button>
    <button data-f="B">베이직</button>
  </div>
  <div class="legend">
    <div><i style="background:#c7dca6"></i>베이직 필지 (B01 부터 B11)</div>
    <div><i style="background:#b9d39a;outline:2px solid #6f8f4e"></i>프리미엄 필지 (P01 부터 P04)</div>
    <div><i style="background:#545a60"></i>커뮤니티 시설</div>
    <div><i style="background:#6fa8b4"></i>수영장</div>
    <div><i style="background:#d6d2ca"></i>단지 도로</div>
  </div>
  <div class="tip" id="tip"></div>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||$('g-base')).appendChild(e);return e;}
const L=(x,y)=>[250+.65*x,520+.65*y];
const U=(x,y)=>[1000+.5*x,100+.5*y];
const mapL=a=>a.map(p=>L(p[0],p[1])), mapU=a=>a.map(p=>U(p[0],p[1]));
const f=n=>n.toFixed(1);
function smooth(pts,closed,t){
  t=t==null?.5:t;const n=pts.length;let d='M'+f(pts[0][0])+' '+f(pts[0][1]);
  const P=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])*t/3,p1[1]+(p2[1]-p0[1])*t/3],c2=[p2[0]-(p3[0]-p1[0])*t/3,p2[1]-(p3[1]-p1[1])*t/3];
    d+=' C'+f(c1[0])+' '+f(c1[1])+' '+f(c2[0])+' '+f(c2[1])+' '+f(p2[0])+' '+f(p2[1]);}
  return d+(closed?' Z':'');
}
const poly=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join(' L')+' Z';
let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
function inPoly(p,vs){let x=p[0],y=p[1],ins=false;for(let i=0,j=vs.length-1;i<vs.length;j=i++){const xi=vs[i][0],yi=vs[i][1],xj=vs[j][0],yj=vs[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));const q=[a[0]+t*dx,a[1]+t*dy];return [Math.hypot(p[0]-q[0],p[1]-q[1]),q];}
function nearest(p,lines){let best=[1e9,null];for(const ln of lines)for(let i=0;i<ln.length-1;i++){const r=segDist(p,ln[i],ln[i+1]);if(r[0]<best[0])best=r;}return best;}
function lerpC(a,b,t){const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}

/* ---------- 지형 데이터 ---------- */
const coast=[[120,690],[250,617],[614,520],[800,380],[1000,190],[1115,100],[1230,0]];
const terrace=mapL([[230,290],[195,330],[125,520],[105,650],[25,800],[40,945],[300,940],[750,880],[830,660],[905,450],[940,90],[920,25],[870,10],[720,70],[500,190],[240,260]]);
const roads=[
  mapL([[240,275],[500,215],[600,170],[740,90],[880,60]]),
  mapL([[480,220],[480,445],[895,430],[880,590],[800,618],[130,605]]),
  mapL([[130,500],[130,800]]),
  mapL([[340,610],[340,770]]),
  mapU([[0,520],[130,420],[250,300],[380,100],[470,85],[640,70]]),
  mapU([[470,95],[520,250],[560,400],[650,550],[700,600],[780,590]])
];
const link=[L(870,60),[900,470],[960,400],U(0,520)];

const plots=[
 {id:'B01',t:'B',lawn:[[240,310],[300,298],[440,318],[455,370],[445,430],[380,440],[300,448],[215,415],[212,345]],b:[[308,365,80,0],[368,390,52,180]]},
 {id:'B02',t:'B',lawn:[[498,272],[570,262],[640,272],[655,330],[640,410],[560,420],[502,400],[490,330]],b:[[613,325,80,0]]},
 {id:'B03',t:'B',lawn:[[672,268],[780,262],[878,278],[888,340],[868,400],[760,406],[682,398],[668,330]],b:[[757,315,54,0],[800,352,84,0]]},
 {id:'B04',t:'B',lawn:[[185,455],[328,458],[345,520],[330,590],[240,600],[148,580],[152,500]],b:[[235,493,84,0]]},
 {id:'B05',t:'B',lawn:[[365,466],[470,460],[578,470],[588,540],[570,598],[470,606],[382,598],[356,540]],b:[[437,557,84,0]]},
 {id:'B06',t:'B',lawn:[[602,462],[720,454],[848,462],[858,520],[818,588],[700,598],[602,588],[592,520]],b:[[697,530,84,0]]},
 {id:'B07',t:'B',lawn:[[62,642],[180,632],[308,642],[318,700],[308,760],[200,788],[82,788],[52,720]],b:[[153,722,84,0],[212,686,54,180]]},
 {id:'B08',t:'B',lawn:[[72,802],[200,794],[308,802],[318,870],[298,928],[180,934],[62,920],[52,860]],b:[[226,849,84,0]]},
 {id:'B09',t:'B',lawn:[[362,662],[450,652],[538,662],[542,780],[528,880],[420,894],[362,870],[354,760]],b:[[420,770,84,0]]},
 {id:'B10',t:'B',lawn:[[553,657],[644,654],[651,760],[644,868],[560,874],[549,760]],b:[[598,733,72,180],[600,800,80,0]]},
 {id:'B11',t:'B',lawn:[[660,652],[760,650],[798,690],[780,800],[720,858],[662,858],[657,750]],b:[[717,737,84,0]]},
 {id:'P01',t:'P',up:1,lawn:[[530,110],[640,76],[698,92],[690,200],[650,280],[560,300],[528,230]],b:[[590,205,108,0],[655,195,108,8]]},
 {id:'P02',t:'P',up:1,lawn:[[700,60],[790,24],[900,32],[934,110],[910,200],[820,214],[758,170],[712,110]],b:[[830,88,108,0],[862,145,108,180]]},
 {id:'P03',t:'P',up:1,lawn:[[300,250],[400,192],[470,202],[510,300],[512,420],[450,490],[330,492],[288,400]],b:[[372,392,104,-10],[440,378,104,180]]},
 {id:'P04',t:'P',up:1,lawn:[[640,282],[760,232],[880,252],[920,330],[880,452],[760,472],[662,470],[620,380]],b:[[740,315,108,0],[765,382,108,180]]}
];
for(const p of plots){const m=p.up?U:L,k=p.up?.5:.65;p.poly=p.lawn.map(q=>m(q[0],q[1]));p.blds=p.b.map(q=>({c:m(q[0],q[1]),s:q[2]*k,r:q[3]}));}

/* ---------- 바탕: 육지, 바다, 해안 ---------- */
const B=$('g-base');
el('rect',{x:150,y:20,width:1420,height:1200,fill:'#dfe6cc'},B);
el('rect',{x:150,y:20,width:1420,height:1200,fill:'#dfe6cc',filter:'url(#grain)'},B);
const shoreOff=coast.map(p=>[p[0]-14,p[1]-18]);
el('path',{d:'M'+shoreOff.map(p=>p.join(' ')).join(' L')+' L1230 -100 L60 -100 L60 760 Z',fill:'url(#sea)'},B);
for(let i=0;i<9;i++){const o=40+i*45;el('path',{d:smooth(coast.map(p=>[p[0]-14-o*.6,p[1]-18-o*.8]),false),fill:'none',stroke:'#ffffff','stroke-opacity':.25-i*.02,'stroke-width':1.2,'stroke-dasharray':(18+i*4)+' '+(30+i*6)},B);}
el('path',{d:smooth(coast.map(p=>[p[0]-10,p[1]-14]),false),fill:'none',stroke:'url(#pebble)','stroke-width':16,'stroke-linecap':'round'},B);
el('path',{d:smooth(coast,false),fill:'none',stroke:'#b7b3ab','stroke-width':26,'stroke-linecap':'round'},B);
el('path',{d:smooth(coast,false),fill:'none',stroke:'#c9c5bd','stroke-width':22,'stroke-linecap':'round'},B);
el('path',{d:smooth(coast.map(p=>[p[0]+6,p[1]+8]),false),fill:'none',stroke:'#c98d7f','stroke-width':4,'stroke-opacity':.8},B);
el('path',{d:smooth(coast,false),fill:'none',stroke:'#e8c86a','stroke-width':1.4,'stroke-dasharray':'14 10'},B);
const tl=el('text',{x:330,y:330,fill:'#5f8996','font-size':26,'font-weight':700,'letter-spacing':'.3em'},B);tl.textContent='바다';
const rl=el('text',{x:0,y:0,fill:'#8a877f','font-size':11,transform:'translate(700 455) rotate(-37)'},B);rl.textContent='해안도로';

/* ---------- 하단 단지 옹벽 ---------- */
el('path',{d:smooth(terrace,true,.25),fill:'#d3dcbc',transform:'translate(5 7)',filter:'url(#blur3)',opacity:.6},B);
el('path',{d:smooth(terrace,true,.25),fill:'#e2e8d2',stroke:'#c9c3b4','stroke-width':7},B);
el('path',{d:smooth(terrace,true,.25),fill:'none',stroke:'#8f8a7c','stroke-width':1.2},B);

/* ---------- 도로 ---------- */
for(const r of roads){el('path',{d:smooth(r,false,.35),fill:'none',stroke:'#b9b4aa','stroke-width':25,'stroke-linecap':'round','stroke-linejoin':'round'},B);}
for(const r of roads){el('path',{d:smooth(r,false,.35),fill:'none',stroke:'url(#pave)','stroke-width':22,'stroke-linecap':'round','stroke-linejoin':'round'},B);}
el('path',{d:smooth(link,false),fill:'none',stroke:'#c5bfb3','stroke-width':12,'stroke-linecap':'round'},B);
el('path',{d:smooth(link,false),fill:'none',stroke:'#e3ddd1','stroke-width':9,'stroke-linecap':'round'},B);

/* ---------- 수영장, 커뮤니티 시설 ---------- */
const p0=L(330,245),p1=L(445,300);
el('rect',{x:p0[0]-3,y:p0[1]-3,width:p1[0]-p0[0]+6,height:p1[1]-p0[1]+6,fill:'#f2efe8',stroke:'#aaa597','stroke-width':1},B);
el('rect',{x:p0[0],y:p0[1],width:p1[0]-p0[0],height:p1[1]-p0[1],fill:'url(#water)'},B);
for(let i=1;i<4;i++)el('path',{d:'M'+(p0[0]+6)+' '+(p0[1]+i*9)+' q 12 -3 24 0 t 24 0 t 24 0',fill:'none',stroke:'#fff','stroke-opacity':.35,'stroke-width':1},B);
// 커뮤니티 시설: 박공 지붕
const cA=L(628,100),cB=L(892,92),cC=L(896,212),cD=L(632,222);
el('path',{d:poly([cA,cB,cC,cD]),fill:'#000',opacity:.28,transform:'translate(6 8)',filter:'url(#blur3)'},B);
const rA=L(690,155),rB=L(830,152);
el('path',{d:poly([cA,cB,rB,rA]),fill:'#5b6167'},B);
el('path',{d:poly([cD,cC,rB,rA]),fill:'#454b51'},B);
el('path',{d:poly([cA,rA,cD]),fill:'#686e74'},B);
el('path',{d:poly([cB,cC,rB]),fill:'#3f4449'},B);
const g1=[L(690,215),L(740,262),L(740,215)],g2=[L(760,212),L(800,258),L(840,210)];
el('path',{d:poly([L(685,212),L(712,262),L(742,212)]),fill:'#50565c',stroke:'#3a3f44','stroke-width':.8},B);
el('path',{d:poly([L(752,210),L(790,258),L(830,208)]),fill:'#50565c',stroke:'#3a3f44','stroke-width':.8},B);
el('path',{d:'M'+rA.join(' ')+' L'+rB.join(' '),stroke:'#2e3236','stroke-width':1.4},B);
const cl=el('text',{x:L(760,165)[0],y:L(760,165)[1]+4,fill:'#fff','font-size':12,'font-weight':700,'text-anchor':'middle'},B);cl.textContent='커뮤니티';
const pl=el('text',{x:(p0[0]+p1[0])/2,y:p1[1]+14,fill:'#4f7c86','font-size':10,'font-weight':700,'text-anchor':'middle'},B);pl.textContent='수영장';

/* ---------- 상단 생울타리 ---------- */
const hedges=[mapU([[680,118],[700,200],[760,238],[900,230],[985,255]]),mapU([[700,205],[652,282],[622,380],[640,472],[700,520]]),mapU([[520,180],[540,260],[600,330]])];
for(const h of hedges){el('path',{d:smooth(h,false),fill:'none',stroke:'#4f6d3e','stroke-width':14,'stroke-linecap':'round'},B);el('path',{d:smooth(h,false),fill:'none',stroke:'#6f8f55','stroke-width':8,'stroke-linecap':'round','stroke-dasharray':'2 7'},B);}

/* ---------- 수목 ---------- */
const T=$('g-trees');
const allRoads=roads.concat([link]);
const trees=[];
for(let i=0;i<1400&&trees.length<520;i++){
  const p=[200+rnd()*1320,60+rnd()*1110];
  const side=nearest(p,[coast]);
  if(side[0]<34)continue;
  // 바다쪽 제외
  const c=side[1];const seg=coast;const k=(p[0]-c[0])*1+(p[1]-c[1])*0;
  if(p[1]< c[1]-2 && p[0]<c[0]+30)continue;
  if(inPoly(p,terrace)&&nearest(p,[terrace.concat([terrace[0]])])[0]>14)continue;
  if(nearest(p,allRoads)[0]<20)continue;
  let bad=false;for(const pl of plots){if(pl.up&&(inPoly(p,pl.poly)||nearest(p,[pl.poly.concat([pl.poly[0]])])[0]<6)){bad=true;break;}}
  if(bad)continue;
  if(nearest(p,hedges)[0]<10)continue;
  const r=6+rnd()*13;
  if(trees.some(t=>Math.hypot(t[0]-p[0],t[1]-p[1])<(t[2]+r)*.62))continue;
  trees.push([p[0],p[1],r]);
}
trees.sort((a,b)=>a[1]-b[1]);
for(const t of trees)el('circle',{cx:t[0]+t[2]*.35,cy:t[1]+t[2]*.45,r:t[2],fill:'#2f3b24',opacity:.22,filter:'url(#blur3)'},T);
for(const t of trees){el('circle',{cx:t[0],cy:t[1],r:t[2],fill:rnd()<.5?'url(#tree)':'url(#tree2)'},T);
  if(t[2]>11)el('circle',{cx:t[0]-t[2]*.3,cy:t[1]-t[2]*.3,r:t[2]*.45,fill:'#b8cf9c',opacity:.35},T);}

/* ---------- 필지와 건물 ---------- */
const P=$('g-plots');
function roof(g,c,s,rot){
  const r=s/2,v=[];for(let i=0;i<5;i++){const a=(rot-90+i*72)*Math.PI/180;v.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)]);}
  el('path',{d:poly(v),fill:'#000',opacity:.3,transform:'translate('+(s*.09)+' '+(s*.12)+')',filter:'url(#blur3)'},g);
  const light=-135*Math.PI/180;
  for(let i=0;i<5;i++){const a=(rot-90+i*72+36)*Math.PI/180;const b=.5+.5*Math.cos(a-light);
    el('path',{d:poly([v[i],v[(i+1)%5],c]),fill:lerpC('#bfc3c8','#ffffff',b),stroke:'#a9adb2','stroke-width':.6,'stroke-linejoin':'round'},g);}
  el('path',{d:poly(v),fill:'none',stroke:'#8e9297','stroke-width':.9},g);
}
const tip=$('tip');
for(const p of plots){
  const g=el('g',{class:'plot','data-t':p.t,'data-id':p.id},P);
  const isP=p.t==='P';
  el('path',{class:'ring',d:smooth(p.poly,true,.6),fill:'none',stroke:'#2b2b2b','stroke-width':2.4,'stroke-dasharray':'6 4'},g);
  el('path',{class:'lawn',d:smooth(p.poly,true,.6),fill:isP?'#b9d39a':'#c7dca6',stroke:isP?'#6f8f4e':'#90ab6e','stroke-width':isP?2:1.4},g);
  el('path',{d:smooth(p.poly,true,.6),fill:'#dfe6cc',filter:'url(#grain)',opacity:.9},g);
  // 가장자리 관목
  const n=p.poly.length,cx=p.poly.reduce((s,q)=>s+q[0],0)/n,cy=p.poly.reduce((s,q)=>s+q[1],0)/n;
  for(let i=0;i<n;i++){const a=p.poly[i],b=p.poly[(i+1)%n];const cnt=2+Math.floor(rnd()*3);
    for(let j=0;j<cnt;j++){if(rnd()<.45)continue;const t=rnd();let x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;x+=(cx-x)*.08;y+=(cy-y)*.08;const r=2.5+rnd()*4;
      el('circle',{cx:x,cy:y,r:r,fill:rnd()<.5?'#6e8f55':'#86a66a'},g);}}
  // 디딤돌, 자갈 마당
  const main=p.blds[0];const nr=nearest(main.c,allRoads);const q=nr[1];
  const dx=q[0]-main.c[0],dy=q[1]-main.c[1],dl=Math.hypot(dx,dy)||1;
  const st=[main.c[0]+dx/dl*main.s*.5,main.c[1]+dy/dl*main.s*.5],en=[q[0]-dx/dl*12,q[1]-dy/dl*12];
  const yard=[main.c[0]+dx/dl*(main.s*.5+10),main.c[1]+dy/dl*(main.s*.5+10)];
  el('ellipse',{cx:yard[0],cy:yard[1],rx:main.s*.42,ry:main.s*.28,fill:'url(#gravel)',transform:'rotate('+(Math.atan2(dy,dx)*180/Math.PI+90)+' '+yard[0]+' '+yard[1]+')'},g);
  if(dl>main.s*.5+20)el('path',{d:'M'+st.join(' ')+' L'+en.join(' '),stroke:'#e9e5dc','stroke-width':4.5,'stroke-dasharray':'4 5','stroke-linecap':'round',fill:'none'},g);
  // 바위
  for(let i=0;i<3;i++){const a=rnd()*6.28,d=main.s*(.7+rnd()*.4);el('circle',{cx:main.c[0]+Math.cos(a)*d,cy:main.c[1]+Math.sin(a)*d,r:1.6+rnd()*2,fill:'#bdb6a8',stroke:'#9b9486','stroke-width':.5},g);}
  for(const b of p.blds)roof(g,b.c,b.s,b.r);
  // 번호 태그
  let lx=main.c[0],ly=main.c[1]+main.s*.5+16;
  if(p.blds.length>1){const o=p.blds[1];ly=Math.max(ly,o.c[1]+o.s*.5+16);}
  const w=isP?36:34;
  el('rect',{x:lx-w/2,y:ly-11,width:w,height:17,rx:8.5,fill:isP?'#2b2b2b':'#ffffff',stroke:'#2b2b2b','stroke-width':1},g);
  const tx=el('text',{x:lx,y:ly+2,'text-anchor':'middle',class:'tag',fill:isP?'#fff':'#2b2b2b'},g);tx.textContent=p.id;if(isP)tx.setAttribute('style','fill:#fff');
  g.addEventListener('mousemove',e=>{tip.textContent=p.id+' · '+(isP?'프리미엄':'베이직')+' (가정)';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+12)+'px';tip.style.opacity=1;});
  g.addEventListener('mouseleave',()=>tip.style.opacity=0);
  g.addEventListener('click',()=>{const on=g.classList.contains('sel');P.querySelectorAll('.plot').forEach(x=>x.classList.remove('sel'));if(!on)g.classList.add('sel');});
}

/* ---------- 방위, 축척 대신 표기 ---------- */
const Tg=$('g-top');
const N=[262,190];
el('circle',{cx:N[0],cy:N[1],r:24,fill:'#fff',stroke:'#2b2b2b','stroke-width':1.2},Tg);
el('path',{d:'M'+N[0]+' '+(N[1]-18)+' L'+(N[0]+7)+' '+(N[1]+12)+' L'+N[0]+' '+(N[1]+6)+' L'+(N[0]-7)+' '+(N[1]+12)+' Z',fill:'#2b2b2b'},Tg);
const nt=el('text',{x:N[0],y:N[1]-30,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#2b2b2b'},Tg);nt.textContent='N';

/* ---------- 필터 ---------- */
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.f;P.querySelectorAll('.plot').forEach(g=>g.classList.toggle('dim',v!=='all'&&g.dataset.t!==v));
}));
})();
</script>
